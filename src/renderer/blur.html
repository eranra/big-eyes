<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Big Eyes blur</title>
    <style>
      /* A screen without eyes. When the eyes replace the screen saver, every other screen is blurred too.
         The window itself has the system blur; this page adds a strong tint and fades it in and out. */
      :root {
        --blur: 1;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        cursor: none;
        user-select: none;
      }
      #tint {
        position: fixed;
        inset: 0;
        opacity: 0;
        transition: opacity 1.2s ease;
        background: radial-gradient(
          ellipse at center,
          rgba(16, 10, 28, calc(0.3 + var(--blur) * 0.4)) 0%,
          rgba(10, 6, 18, calc(0.45 + var(--blur) * 0.45)) 100%
        );
      }
      body.on #tint {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="tint"></div>
    <script src="blur.js"></script>
  </body>
</html>
